version: "1.0"
pipeline: ai-e2e-workflow

# Phase 1: Explicit completion signaling contract
completion_marker:
  # Format-aware footer appended as LAST LINE of primary artifact
  # Supported prefixes: <!-- (md), // (ts), # (yaml), etc. Regex ignores prefix.
  regex: "@step-complete step=(\d+) runId=([\\w-]+T[\\w:]+Z?)"
  poll_interval_ms: 500  # Configurable; watcher default matches this

steps:
  - id: resolve
    name: Resolve Inputs
    order: 1
    gated: false
    description: Validate app profile, resolve environment variables, validate the selected flow file, generate run ID
    primary_output:
      path: results/{{app}}/flows/<flow-id>/{{run}}/step1-resolve/run-metadata.json
      format: json
    inputs: []
    outputs:
      - name: run-metadata
        path: results/{{app}}/flows/<flow-id>/{{run}}/step1-resolve/run-metadata.json
        format: json
      - name: flow-inventory
        path: results/{{app}}/flows/<flow-id>/{{run}}/step1-resolve/flow-inventory.json
        format: json
      - name: resolved-test-data
        path: results/{{app}}/flows/<flow-id>/{{run}}/resolved-test-data.json
        format: json

  - id: discover
    name: Discover UI
    order: 2
    gated: false
    description: Capture Playwright ARIA snapshots for the selected flow start path and identify interactive elements
    primary_output:
      path: results/{{app}}/flows/<flow-id>/{{run}}/step2-discover/snapshot.yaml
      format: yaml
    inputs:
      - name: run-metadata
        path: results/{{app}}/flows/<flow-id>/{{run}}/step1-resolve/run-metadata.json
        format: json
      - name: flow-inventory
        path: results/{{app}}/flows/<flow-id>/{{run}}/step1-resolve/flow-inventory.json
        format: json
    outputs:
      - name: snapshot
        path: results/{{app}}/flows/<flow-id>/{{run}}/step2-discover/snapshot.yaml
        format: yaml
      - name: merged-snapshot
        path: results/{{app}}/flows/<flow-id>/{{run}}/step2-discover/snapshot.merged.yaml
        format: yaml
      - name: path-snapshots
        path: results/{{app}}/flows/<flow-id>/{{run}}/step2-discover/paths/<path-label>.snapshot.yaml
        format: yaml
      - name: selector-candidates
        path: results/{{app}}/flows/<flow-id>/{{run}}/step2-discover/selector-candidates.md
        format: markdown

  - id: extract-selectors
    name: Extract Selectors
    order: 3
    gated: false
    description: Normalize selector candidates with locator priority annotations, path provenance, and flow provenance
    primary_output:
      path: results/{{app}}/flows/<flow-id>/{{run}}/step3-extract-selectors/normalized-selectors.md
      format: markdown
    inputs:
      - name: merged-snapshot
        path: results/{{app}}/flows/<flow-id>/{{run}}/step2-discover/snapshot.merged.yaml
        format: yaml
      - name: selector-candidates
        path: results/{{app}}/flows/<flow-id>/{{run}}/step2-discover/selector-candidates.md
        format: markdown
    outputs:
      - name: normalized-selectors
        path: results/{{app}}/flows/<flow-id>/{{run}}/step3-extract-selectors/normalized-selectors.md
        format: markdown

  - id: draft-page-object
    name: Draft Page Object
    order: 4
    gated: true
    description: Generate one shared app-level TypeScript page object from normalized selectors
    primary_output:
      path: results/{{app}}/flows/<flow-id>/{{run}}/step4-draft-page-object/page-object.draft.ts
      format: typescript
    inputs:
      - name: normalized-selectors
        path: results/{{app}}/flows/<flow-id>/{{run}}/step3-extract-selectors/normalized-selectors.md
        format: markdown
    outputs:
      - name: page-object-draft
        path: results/{{app}}/flows/<flow-id>/{{run}}/step4-draft-page-object/page-object.draft.ts
        format: typescript

  - id: draft-tests
    name: Draft Test Scenarios
    order: 5
    gated: true
    description: Generate Gherkin feature scenarios and scenario coverage for the selected flow
    primary_output:
      path: results/{{app}}/flows/<flow-id>/{{run}}/step5-draft-tests/test-drafts-index.md
      format: markdown
    inputs:
      - name: page-object-draft
        path: results/{{app}}/flows/<flow-id>/{{run}}/step4-draft-page-object/page-object.draft.ts
        format: typescript
      - name: flow-inventory
        path: results/{{app}}/flows/<flow-id>/{{run}}/step1-resolve/flow-inventory.json
        format: json
      - name: knowledge
        path: knowledge/{{app}}/knowledge.md
        format: markdown
    outputs:
      - name: test-scenarios
        path: results/{{app}}/flows/<flow-id>/{{run}}/test-scenarios.feature
        format: gherkin
      - name: scenario-coverage
        path: results/{{app}}/flows/<flow-id>/{{run}}/scenario-coverage.md
        format: markdown
      - name: draft-index
        path: results/{{app}}/flows/<flow-id>/{{run}}/step5-draft-tests/test-drafts-index.md
        format: markdown

  - id: write-spec
    name: Write Playwright Spec
    order: 6
    gated: false
    description: Promote the approved feature file and generate the selected flow Playwright spec from approved scenarios and page objects
    # Completion artifact is a per-run report this step writes. The spec/feature it
    # generates live under tests/ (committed); a marker there would persist/stale
    # across runs, so completion is signalled via this throwaway per-run file instead.
    primary_output:
      path: results/{{app}}/flows/<flow-id>/{{run}}/step6-write-spec/write-spec-report.md
      format: markdown
    inputs:
      - name: test-scenarios
        path: results/{{app}}/flows/<flow-id>/{{run}}/test-scenarios.feature
        format: gherkin
      - name: scenario-coverage
        path: results/{{app}}/flows/<flow-id>/{{run}}/scenario-coverage.md
        format: markdown
      - name: page-object
        path: src/pages/{{app}}/{{app}}.page.ts
        format: typescript
    outputs:
      - name: write-spec-report
        path: results/{{app}}/flows/<flow-id>/{{run}}/step6-write-spec/write-spec-report.md
        format: markdown
      - name: approved-feature
        path: tests/{{app}}/<flow-id>.feature
        format: gherkin
      - name: spec
        path: tests/{{app}}/<flow-id>.spec.ts
        format: typescript

  - id: run-fix
    name: Run Tests & Fix Script Bugs
    order: 7
    gated: false
    description: Execute the selected flow test, triage failures, fix script bugs only
    primary_output:
      path: results/{{app}}/flows/<flow-id>/{{run}}/step7-run-fix/test-report.md
      format: markdown
    inputs:
      - name: spec
        path: tests/{{app}}/<flow-id>.spec.ts
        format: typescript
    outputs:
      - name: test-report
        path: results/{{app}}/flows/<flow-id>/{{run}}/step7-run-fix/test-report.md
        format: markdown
      - name: flow-summary
        path: results/{{app}}/flows/<flow-id>/{{run}}/flow-summary.md
        format: markdown
      - name: html-report
        path: results/{{app}}/flows/<flow-id>/{{run}}/step7-run-fix/playwright-report/
        format: html
      - name: traces
        path: results/{{app}}/flows/<flow-id>/{{run}}/step7-run-fix/traces/
        format: binary
      - name: screencast-videos
        path: results/{{app}}/flows/<flow-id>/{{run}}/step7-run-fix/
        format: webm

  - id: summarize
    name: Summarize & Update Knowledge
    order: 8
    gated: false
    description: Write pipeline and flow summaries, update app knowledge with verified observations, and apply six-run archival pruning
    primary_output:
      path: results/{{app}}/flows/<flow-id>/{{run}}/pipeline-summary.md
      format: markdown
    inputs:
      - name: test-report
        path: results/{{app}}/flows/<flow-id>/{{run}}/step7-run-fix/test-report.md
        format: markdown
      - name: flow-summary
        path: results/{{app}}/flows/<flow-id>/{{run}}/flow-summary.md
        format: markdown
    outputs:
      - name: pipeline-summary
        path: results/{{app}}/flows/<flow-id>/{{run}}/pipeline-summary.md
        format: markdown
      - name: knowledge-update
        path: knowledge/{{app}}/knowledge.md
        format: markdown
      - name: rules-update
        path: knowledge/{{app}}/rules.md
        format: markdown
      - name: current-knowledge
        path: knowledge/{{app}}/current.md
        format: markdown
      - name: prune-log
        path: knowledge/{{app}}/prune-log.md
        format: markdown
      - name: archive
        path: knowledge/{{app}}/archive.md
        format: markdown
