version: "1.0"
id: room-search
name: Room search
goal: Verify a public visitor can choose stay dates, check availability, and see room booking options without completing a reservation.
startPath: "/#booking"
tags:
  - generated
auth:
  required: false
sideEffects: none
allowedActions:
  - navigate
  - fill-form
  - submit-query
  - assert
forbiddenActions:
  - create-booking
  - complete-checkout
successCriteria:
  - Visitor sees available room booking options
  - Visitor remains outside reservation checkout
outOfScope:
  - Clicking room Book now links
  - Completing a room reservation
knowledgeRefs:
  - knowledge/automation-in-testing/rules.md
testData:
  checkIn:
    strategy: relative-date
    offsetDays: 7
    format: DD/MM/YYYY
  checkOut:
    strategy: relative-date
    offsetDays: 8
    format: DD/MM/YYYY
